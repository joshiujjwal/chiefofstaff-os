version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiefofstaff
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: chiefofstaff_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chiefofstaff']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiefofstaff
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: chiefofstaff_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral — fast, disposable test DB

volumes:
  pgdata:
